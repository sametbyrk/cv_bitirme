<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1422"/><stop offset="1" stop-color="#17243b"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 10 6 1 11" stroke="#8ea3c6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="92" y="105" fill="#91a7cb" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4">VITASCOR · AUTO-TAILOR</text><text x="92" y="169" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="750">A review-first AI workflow</text><text x="92" y="210" fill="#aab8ce" font-family="Inter,Arial,sans-serif" font-size="22">The source resume stays untouched until the candidate accepts the proposed edits.</text>
  <g filter="url(#s)"><rect x="90" y="320" width="290" height="260" rx="24" fill="#1d2b42" stroke="#435675"/><rect x="445" y="320" width="290" height="260" rx="24" fill="#1d2b42" stroke="#3b82f6"/><rect x="800" y="320" width="290" height="260" rx="24" fill="#1d2b42" stroke="#8b5cf6"/><rect x="1155" y="320" width="350" height="260" rx="24" fill="#1d2b42" stroke="#22c99a"/></g>
  <path d="M380 450h55M735 450h55M1090 450h55" stroke="#8ea3c6" stroke-width="4" marker-end="url(#a)"/>
  <g font-family="Inter,Arial,sans-serif"><text x="122" y="368" fill="#79a8ff" font-size="17" font-weight="700">01 · INPUT</text><text x="122" y="420" fill="#fff" font-size="28" font-weight="700">Your resume</text><text x="122" y="463" fill="#b4c2d8" font-size="19">+ target job description</text><text x="122" y="520" fill="#778dad" font-size="17">Saved CV or current draft</text>
  <text x="477" y="368" fill="#79a8ff" font-size="17" font-weight="700">02 · GUARD</text><text x="477" y="420" fill="#fff" font-size="28" font-weight="700">Validate</text><text x="477" y="463" fill="#b4c2d8" font-size="19">Input · access · usage quota</text><text x="477" y="520" fill="#778dad" font-size="17">Only permitted text fields</text>
  <text x="832" y="368" fill="#c4a7ff" font-size="17" font-weight="700">03 · REWRITE</text><text x="832" y="420" fill="#fff" font-size="28" font-weight="700">Gemini</text><text x="832" y="463" fill="#b4c2d8" font-size="19">Rephrase supported content</text><text x="832" y="520" fill="#778dad" font-size="17">Keep evidence and IDs intact</text>
  <text x="1187" y="368" fill="#55dfb5" font-size="17" font-weight="700">04 · CANDIDATE REVIEW</text><text x="1187" y="420" fill="#fff" font-size="28" font-weight="700">Compare &amp; decide</text><text x="1187" y="463" fill="#b4c2d8" font-size="19">Accept edits or discard them</text><text x="1187" y="520" fill="#778dad" font-size="17">Suggestions are not auto-applied</text></g>
  <rect x="90" y="665" width="1415" height="105" rx="24" fill="#152238" stroke="#344764"/><text x="128" y="710" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Editable content</text><text x="128" y="746" fill="#aab8ce" font-family="Inter,Arial,sans-serif" font-size="18">Summary · experience descriptions · project descriptions</text><text x="900" y="728" fill="#61d8b3" font-family="Inter,Arial,sans-serif" font-size="18">Skills are suggested only when evidence already exists in the CV.</text>
</svg>
